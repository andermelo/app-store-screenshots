<!doctype html>
<!--
  Campaign editor shell — reference markup.
  Copy this file to `.store-screens/<campaign>/html/index.html`, then:
    1. keep `editor.css` next to it (or inline it when the page must be a single file, e.g. a claude.ai Artifact);
    2. paste the <symbol> set from `icons.svg` into the hidden <svg> at the top of <body>;
    3. write the board artwork CSS inside <style id="campaign-css"> — that is the only CSS the PNG export embeds;
    4. fill the `data-*` hooks and the script contract listed in references/editor-design.md.
  Every id below is part of the editor's JavaScript contract; keep them stable.
  UI copy is always English, regardless of the campaign's source locale — this is the editor's own
  interface, not exported content. The board text inside .headline/.subhead still follows that locale.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="app-store-export" content="true">
  <title>{{appName}} · Campaign editor</title>
  <link rel="stylesheet" href="editor.css">
  <style id="campaign-css">
    /* Board artwork only. Local @font-face rules, .board layout, .device, .headline, .subhead ... */
  </style>
</head>
<body>
  <!-- icons.svg goes here -->

  <header class="topbar" aria-label="Campaign tools">
    <div class="topbar-left">
      <!-- Optional: enable only with real captures for both devices; keep saved state separate. -->
      <div class="btn-group" id="device-switcher" role="group" aria-label="Screenshot device" hidden>
        <button class="btn btn-icon" type="button" data-device="iphone" aria-label="iPhone screenshots" aria-pressed="true" data-tip="iPhone screenshots"><svg class="icon"><use href="#i-smartphone"/></svg></button>
        <button class="btn btn-icon" type="button" data-device="ipad" aria-label="iPad screenshots" aria-pressed="false" data-tip="iPad screenshots"><svg class="icon"><use href="#i-tablet"/></svg></button>
      </div>
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"><svg class="icon"><use href="#i-smartphone"/></svg></span>
        <span class="brand-name">App Store Studio</span>
        <span class="brand-campaign" id="campaign-name">{{appName}}</span>
      </div>
    </div>

    <div class="seg" id="locale-seg" role="tablist" aria-label="Locale">
      <!-- one <button role="tab" data-value="<bcp47>"> per locale -->
    </div>

    <div class="topbar-right">
      <div class="btn-group">
        <button class="btn btn-icon" id="undo" aria-label="Undo" data-tip="Undo ⌘Z" disabled><svg class="icon"><use href="#i-undo"/></svg></button>
        <button class="btn btn-icon" id="redo" aria-label="Redo" data-tip="Redo ⇧⌘Z" disabled><svg class="icon"><use href="#i-redo"/></svg></button>
      </div>
      <span class="divider"></span>
      <div class="btn-group">
        <button class="btn btn-icon" id="load-settings" aria-label="Load settings" data-tip="Load canvas-settings.json"><svg class="icon"><use href="#i-upload"/></svg></button>
        <button class="btn btn-icon" id="save-settings" aria-label="Save settings" data-tip="Save canvas-settings.json"><svg class="icon"><use href="#i-save"/></svg></button>
        <input type="file" id="settings-file" accept="application/json" hidden>
        <button class="btn btn-icon" id="toggle-theme" aria-label="Toggle editor theme" data-tip="Editor theme"><svg class="icon" id="theme-icon"><use href="#i-moon"/></svg></button>
      </div>
      <span class="divider"></span>
      <button class="btn btn-icon" id="appstore-preview-toggle" aria-label="Preview in App Store" data-tip="App Store preview"><svg class="icon"><use href="#i-eye"/></svg></button>
      <button class="btn btn-icon" id="export-current" aria-label="Export selected board" data-tip="Export selected PNG"><svg class="icon"><use href="#i-image"/></svg></button>
      <button class="btn btn-primary" id="export-all"><svg class="icon"><use href="#i-layers"/></svg><span id="export-all-label">Export PNGs</span></button>
      <span class="divider"></span>
      <button class="btn btn-icon is-active" id="toggle-inspector" aria-label="Toggle inspector" aria-pressed="true" data-tip="Inspector"><svg class="icon"><use href="#i-panel-right"/></svg></button>
    </div>
  </header>

  <main class="canvas" id="canvas">
    <div class="gallery" id="gallery"></div>
  </main>

  <footer class="statusbar" aria-label="Status">
    <span class="status-item" id="status-count"></span>
    <span class="status-item" id="status-size"></span>
    <span class="status-item" id="status-safe"></span>
    <span class="spacer"></span>
    <span class="status-item" id="status-saved" role="status" aria-live="polite"><span class="dot"></span><span class="spinner" aria-hidden="true"></span><span class="autosave-text">Saved locally</span></span>
    <label class="zoom"><svg class="icon sm"><use href="#i-zoom"/></svg><input type="range" id="zoom" min="12" max="30" step="1" value="18" aria-label="Zoom"><output id="zoom-value">18%</output></label>
  </footer>

  <div class="toast-host" id="toast-host" role="status" aria-live="polite"></div>

  <aside class="inspector" id="inspector" aria-label="Inspector">
    <div class="inspector-head">
      <div class="crumb"><span class="crumb-locale" id="crumb-locale"></span><span class="sep">/</span><span class="crumb-scene" id="crumb-scene"></span></div>
      <button class="btn btn-icon sm btn-ghost-danger" id="reset-current" aria-label="Reset this board" data-tip="Reset" data-tip-pos="left"><svg class="icon sm"><use href="#i-rotate-ccw"/></svg></button>
    </div>
    <div class="tabs" role="tablist">
      <button class="tab is-active" role="tab" data-tab="design" aria-selected="true"><svg class="icon sm"><use href="#i-layout"/></svg>Design</button>
      <button class="tab" role="tab" data-tab="copy" aria-selected="false"><svg class="icon sm"><use href="#i-type"/></svg>Copy</button>
    </div>
    <div class="inspector-body">
      <section class="panel" data-panel="design">
        <!-- groups: Template & layout (layout choices are .layout-picker tile grids with .layout-glyph previews, never plain selects) · Background · Device frame · Order
             When the campaign also has a decorative background image layer (e.g. a doodle), that layer's opacity range
             (0-100) and a per-scene "hide on this board" checkbox are mandatory, in the Background group; the layer
             itself stays opt-in, but never hardcode its opacity once it exists -->
      </section>
      <section class="panel" data-panel="copy" hidden>
        <div class="group">
          <h3 class="group-title">Spacing</h3>
          <div class="field"><label class="field-label" for="copy-gap">Title → description <output id="copy-gap-value">Template</output></label><input type="range" id="copy-gap" min="0" max="240" step="1" value="56"></div>
          <button class="btn sm btn-outline" id="copy-gap-reset" type="button">Use template spacing</button>
          <p class="hint">This board only. Adjusts the gap below the actual title, without moving the screenshot.</p>
        </div>
        <!-- groups: Headline · Subhead (text, family, size/weight, line-height/tracking, style/align, color)
             Standard per group, for every campaign: a text highlighter/marker, a 3-way style toggle (None/Straight/Brush,
             default None), a 10-100 thickness range, and a color field. See "Text highlighter" in editor-design.md. -->
      </section>
    </div>
  </aside>

  <div class="store-preview-backdrop" id="store-preview-backdrop" hidden></div>
  <section class="store-preview-modal" id="store-preview" role="dialog" aria-modal="true" aria-labelledby="store-preview-title" hidden>
    <!-- read-only App Store listing preview built from live board clones -->
  </section>

  <script>
    // Campaign data, layouts, state, history, export, render route. See references/editor-design.md.

    // Transient confirmation. tone: "success" | "danger" | undefined. Keep messages short, in English.
    function showToast(message, {tone, icon = tone === "danger" ? "i-x" : "i-check", duration = 2600} = {}) {
      const host = document.getElementById("toast-host");
      const toast = document.createElement("div");
      toast.className = "toast" + (tone ? ` is-${tone}` : "");
      toast.innerHTML = `<svg class="icon"><use href="#${icon}"/></svg><span></span>`;
      toast.querySelector("span").textContent = message;
      host.append(toast);
      setTimeout(() => { toast.classList.add("is-leaving"); toast.addEventListener("animationend", () => toast.remove(), {once: true}); setTimeout(() => toast.remove(), 400); }, duration);
    }
    // save-settings: after canvas-settings.json is written, showToast("Settings saved", {tone: "success"});
    // a cancelled file picker (AbortError) shows nothing; any other failure shows a danger toast.

    // Autosave indicator. Every localStorage write of campaign content calls noteAutosave():
    // rapid edits coalesce into one "saving" pulse, then a "Saved :)" shine, then idle.
    // Zoom/locale preferences are not progress and must NOT call it.
    const autosave = (() => {
      const el = document.getElementById("status-saved");
      const text = el?.querySelector(".autosave-text");
      const IDLE = "Saved locally", SAVING = "Saving…", SAVED = "Saved :)";
      let savingTimer = null, savedTimer = null;
      function show(state, label) {
        if (!el) return;
        el.classList.toggle("is-saving", state === "saving");
        el.classList.toggle("is-saved", state === "saved");
        if (text && text.textContent !== label) text.textContent = label;
      }
      return {
        note() {
          if (!el) return;
          clearTimeout(savedTimer);
          if (!el.classList.contains("is-saving")) show("saving", SAVING);
          clearTimeout(savingTimer);
          savingTimer = setTimeout(() => {
            show("saved", SAVED);
            savedTimer = setTimeout(() => show("idle", IDLE), 2200);
          }, 500);
        }
      };
    })();
    function noteAutosave() { autosave.note(); }

    // Call noteAutosave() from every localStorage write of campaign content (per-route copy state,
    // design state, history restore). NOT from zoom/locale/theme preferences.

    // Status bar counts are DERIVED from the rendered gallery — never type "15 PNGs" or
    // "15 boards · 3 locales" into the markup. Call syncCounts() once after buildGallery() and
    // watchCounts() so any later add/remove/hide of boards updates the labels automatically.
    // BOARD = { width, height } and SAFE come from canvas-settings.json; scenes is the campaign data.
    function syncCounts() {
      const boards = [...document.querySelectorAll(".preview .board")];
      const localesInUse = new Set(boards.map(board => board.dataset.locale));
      const localeCount = localesInUse.size || Object.keys(scenes).length;
      const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;
      const exportLabel = document.getElementById("export-all-label");
      if (exportLabel) exportLabel.textContent = `Export ${plural(boards.length, "PNG", "PNGs")}`;
      const exportButton = document.getElementById("export-all");
      if (exportButton) exportButton.disabled = boards.length === 0;
      const count = document.getElementById("status-count");
      if (count) count.textContent = `${plural(boards.length, "board", "boards")} · ${plural(localeCount, "locale", "locales")}`;
      const size = document.getElementById("status-size");
      if (size) size.textContent = `${BOARD.width} × ${BOARD.height} px`;
      const safe = document.getElementById("status-safe");
      if (safe) safe.textContent = `safe margin ${SAFE} px`;
    }
    let countsObserver = null;
    function watchCounts() {
      if (countsObserver) return;
      const gallery = document.getElementById("gallery");
      if (!gallery || typeof MutationObserver === "undefined") return;
      countsObserver = new MutationObserver(() => syncCounts());
      countsObserver.observe(gallery, { childList: true, subtree: true, attributes: true, attributeFilter: ["hidden", "data-locale"] });
    }
  </script>
</body>
</html>
