interface:
  display_name: "App Store Screenshots"
  short_description: "Capture iOS screens for Figma, Sketch, or HTML"
  default_prompt: "Use $app-store-screenshots to create or update my App Store campaign, reuse existing captures and the selected composition target, and export the requested scenes."

dependencies:
  tools:
    - type: "mcp"
      value: "figma"
      description: "Remote Figma MCP server for asset upload and editable canvas updates"
      transport: "streamable_http"
      url: "https://mcp.figma.com/mcp"

policy:
  allow_implicit_invocation: true
